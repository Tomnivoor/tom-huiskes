<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tom Huiskes for Haystack</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column briefing; photo-led hero, one featured proof card, a scaled career timeline; cards only where siblings are compared. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#E8ECF2; --fg:#17212B; --muted:#5B6975; --line:#D4DBE4;
  --accent:#176B57; --accent-ink:#FFFFFF; --accent-soft:#DDEFE8; --spark:#E2A400; --spark-soft:#FBEBCB;
  --ok:#1F8A4C; --ok-soft:#DCF2E4; --mid:#B9770E; --mid-soft:#FBEBCB; --dev:#5B6975; --dev-soft:#E8ECF2;
  --edu:#7C8B97; --side:#C9A227;
  --display:"Bricolage Grotesque","Avenir Next","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
  --radius:10px; --max:1040px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F161C; --surface:#161F27; --surface-2:#1E2932; --fg:#E7EDF2; --muted:#9AA8B4; --line:#2B3842;
    --accent:#4FB596; --accent-ink:#0F161C; --accent-soft:#17352D; --spark:#F2B733; --spark-soft:#3B2F12;
    --ok:#5CC98A; --ok-soft:#173A27; --mid:#E6B04A; --mid-soft:#3B2F12; --dev:#9AA8B4; --dev-soft:#1E2932;
    --edu:#6E7E8A; --side:#D9B23A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F161C; --surface:#161F27; --surface-2:#1E2932; --fg:#E7EDF2; --muted:#9AA8B4; --line:#2B3842;
  --accent:#4FB596; --accent-ink:#0F161C; --accent-soft:#17352D; --spark:#F2B733; --spark-soft:#3B2F12;
  --ok:#5CC98A; --ok-soft:#173A27; --mid:#E6B04A; --mid-soft:#3B2F12; --dev:#9AA8B4; --dev-soft:#1E2932;
  --edu:#6E7E8A; --side:#D9B23A; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.12}
h1{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(1.35rem,2.6vw,1.75rem);font-weight:800;letter-spacing:-.01em}
h3{font-size:1.05rem;font-weight:600}
p{margin:0} a{color:var(--accent)}
.eyebrow,.lbl{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:var(--max);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 20px;padding-block:10px}
.brand{font-family:var(--display);font-weight:800;font-size:1rem;margin-right:auto}
.bar nav{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.84rem}
.bar nav a{color:var(--muted);text-decoration:none}
.bar nav a:hover,.bar nav a:focus-visible{color:var(--accent)}

/* hero */
.hero{padding-block:28px;border-bottom:1px solid var(--line)}
.hero .grid{display:grid;grid-template-columns:190px 1fr;gap:28px;align-items:center}
.photo{width:100%;max-width:190px;aspect-ratio:4/5;object-fit:cover;border-radius:12px;display:block;background:var(--surface-2)}
.hero .lede{font-size:1.02rem;max-width:56ch;margin-top:10px;color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.facts > div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0}
.facts .k{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.facts .v{font-weight:600;font-size:.88rem}

section{padding-block:36px;border-bottom:1px solid var(--line)}
section .head{display:flex;align-items:baseline;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;margin-bottom:18px}
section .head p{color:var(--muted);max-width:56ch;font-size:.95rem}

/* why */
.story{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.story article{min-width:0;border-top:3px solid var(--accent);padding-top:12px}
.story .n{font-family:var(--mono);font-size:.7rem;color:var(--accent);letter-spacing:.1em;margin-bottom:6px;text-transform:uppercase}
.story h3{margin-bottom:6px}
.story p{font-size:.95rem}

/* built */
.feature{display:grid;grid-template-columns:1.15fr 1fr;gap:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;align-items:start}
.feature .shot{display:block;border-radius:8px;overflow:hidden;border:1px solid var(--line);position:relative;text-decoration:none}
.feature .shot img{display:block;width:100%;height:auto}
.feature .body{min-width:0;display:flex;flex-direction:column;gap:12px}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.nums div{background:var(--accent-soft);border-radius:8px;padding:8px 10px;min-width:0}
.nums b{display:block;font-family:var(--display);font-weight:800;font-size:1.25rem;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums}
.nums span{font-size:.72rem;color:var(--muted);line-height:1.25;display:block}
.btn{align-self:flex-start;display:inline-flex;gap:8px;align-items:center;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;font-size:.9rem;padding:8px 14px;border-radius:8px}
.btn:hover{filter:brightness(1.08)} .btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.note{font-size:.78rem;color:var(--muted)}
.ba{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:.92rem;align-items:baseline}
.ba .t{font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:4px;text-align:center}
.ba .t.b{background:var(--surface-2);color:var(--muted)} .ba .t.a{background:var(--accent-soft);color:var(--accent)}
.ba p{min-width:0}
.projects{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.proj{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.proj .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tag{font-family:var(--mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:4px;white-space:nowrap;background:var(--ok-soft);color:var(--ok)}
.tools{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}
.tools span{font-family:var(--mono);font-size:.7rem;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}

/* fit */
.meter{display:flex;height:12px;border-radius:999px;overflow:hidden;gap:2px;margin-bottom:8px}
.meter i{display:block;height:100%}
.meter .ok{background:var(--ok)} .meter .mid{background:var(--mid)} .meter .dev{background:var(--dev)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.85rem;color:var(--muted);margin-bottom:16px}
.legend b{color:var(--fg);font-family:var(--mono);font-weight:500}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.fit{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.fit .row{display:grid;grid-template-columns:14px 1fr 1.6fr;gap:12px;padding:10px 14px;border-top:1px solid var(--line);align-items:baseline}
.fit .row:first-child{border-top:0}
.fit .dot{width:10px;height:10px;border-radius:50%;align-self:center}
.dot.ok{background:var(--ok)} .dot.mid{background:var(--mid)} .dot.dev{background:var(--dev)}
.fit .req{font-weight:600;font-size:.92rem;min-width:0}
.fit .ev{font-size:.9rem;color:var(--muted);min-width:0}

/* strengths */
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.two h3{margin-bottom:12px}
.list{display:flex;flex-direction:column;gap:12px}
.list .it{border-left:3px solid var(--accent);padding-left:12px;min-width:0}
.list.grow .it{border-left-color:var(--mid)}
.list b{display:block;font-weight:600}
.list p{color:var(--muted);font-size:.92rem}

/* timeline */
.tl{display:grid;grid-template-columns:minmax(0,230px) 1fr;gap:0 16px;align-items:center}
.tl .axis{grid-column:2;position:relative;height:22px;font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.tl .axis span{position:absolute;transform:translateX(-50%);top:0;font-variant-numeric:tabular-nums}
.tl .lab{padding-block:8px;border-top:1px solid var(--line);min-width:0}
.tl .lab b{display:block;font-size:.92rem;line-height:1.25}
.tl .lab small{display:block;font-size:.78rem;color:var(--muted);line-height:1.35}
.tl .track{position:relative;height:100%;min-height:40px;border-top:1px solid var(--line);background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(15.3846% - 1px),var(--line) calc(15.3846% - 1px),var(--line) 15.3846%)}
.tl .seg{position:absolute;top:50%;height:14px;transform:translateY(-50%);border-radius:4px;background:var(--accent)}
.tl .seg.edu{background:var(--edu)} .tl .seg.side{background:var(--side)}
.tl .seg.now{border-top-right-radius:0;border-bottom-right-radius:0}
.tl .seg.now::after{content:"";position:absolute;right:-7px;top:50%;transform:translateY(-50%);border:7px solid transparent;border-left-color:var(--accent);border-right:0}
.tl .yrs{font-family:var(--mono);font-size:.7rem;color:var(--accent)}
.tlkey{display:flex;gap:6px 18px;flex-wrap:wrap;margin-top:12px;font-size:.82rem;color:var(--muted)}
.tlkey i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* ask */
.ask .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.q{perspective:1000px;min-height:132px}
.q button{width:100%;height:100%;min-height:132px;border:0;background:transparent;padding:0;cursor:pointer;text-align:left;font:inherit;color:inherit;position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.7,.2,1)}
.q button:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:var(--radius)}
.q.flipped button{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--line)}
.face.front{background:var(--surface)}
.face.front .qtext{font-family:var(--display);font-weight:600;font-size:1rem;line-height:1.28}
.face.front .hint{font-family:var(--mono);font-size:.66rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.face.back{transform:rotateY(180deg);background:var(--fg);color:var(--bg);border-color:var(--fg)}
.face.back .ans{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.01em;line-height:1.05}
.face.back .ans.real{font-size:.92rem;font-weight:500;font-family:var(--body);line-height:1.42}
.face.back .sub{font-family:var(--mono);font-size:.66rem;opacity:.75;letter-spacing:.08em;text-transform:uppercase}
.q.spark .face.back{background:var(--spark);color:#17212B;border-color:var(--spark)}
@media (prefers-reduced-motion: reduce){.q button{transition:none}}

.personal{max-width:62ch;display:flex;flex-direction:column;gap:10px}
footer{padding-block:28px 44px;color:var(--muted);font-size:.88rem}
footer .wrap{display:flex;flex-direction:column;gap:10px}
footer .contact{display:flex;flex-wrap:wrap;gap:8px 24px;font-family:var(--mono);color:var(--fg);font-size:.9rem;align-items:center}
footer .contact button{font:inherit;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:4px;padding:2px 8px;margin-left:8px;cursor:pointer}
[hidden]{display:none!important}

@media print{
  .bar{position:static}
  section,.hero{break-inside:auto}
  .proj,.feature,.story article,.list .it,.fit .row{break-inside:avoid}
  .q{min-height:0;perspective:none}
  .q button{min-height:0;transform:none!important;transition:none;transform-style:flat;display:block}
  .face{position:static;transform:none!important;backface-visibility:visible}
  #ask .head p,footer .contact button{display:none}
  .face.front{border-radius:var(--radius) var(--radius) 0 0;border-bottom:0}
  .face.front .hint{display:none}
  .face.back{border-radius:0 0 var(--radius) var(--radius)}
  .face.back .ans{font-size:1.15rem}
  #ask{break-before:page}
}

@media (max-width:860px){
  .story,.two,.feature{grid-template-columns:1fr}
  .ask .grid{grid-template-columns:1fr 1fr}
  .fit .row{grid-template-columns:14px 1fr} .fit .ev{grid-column:2}
}
@media (max-width:620px){
  .hero .grid{grid-template-columns:110px 1fr;gap:16px;align-items:start}
  .projects{grid-template-columns:1fr}
  .nums{grid-template-columns:repeat(2,1fr)}
  .tl{grid-template-columns:1fr}
  .tl .axis{grid-column:1}
  .tl .lab{border-top:1px solid var(--line);padding-bottom:2px}
  .tl .track{border-top:0;min-height:22px}
}
@media (max-width:520px){ .ask .grid{grid-template-columns:1fr} }
</style>

about 25 colleagues. Built mostly in Claude Code; adopted through sessions, not slide decks.", "before": "Before", "after": "After", "live": "in use", "feature": {"t": "Customer's Voice", "before": "Customer insight scattered across Data Studio, loose sheets and a PowerPoint. Box decisions on gut feeling.", "after": "One five tab dashboard the whole organisation plans with. Adoption came from a walkthrough per team, not an email.", "nums": [["13", "box editions"], ["30,044", "responses"], ["118", "product scores"], ["218", "themes"]], "open": "", "note": "Dashboard in use at No Waste Army, shown with real figures.", "alt": "Overview page of the Customer's Voice dashboard with scores per box edition"}, "items": [{"t": "AI adoption as a programme", "before": "AI could do 'something', but not in anyone's own working week. One shared account, no structure.", "after": "One on ones with every team member, a priority list, 45 minute hands-on sessions, Claude lessons for the box team, a Claude Team proposal to the directors. The box team runs inventory, specs and inbox on Claude without me.", "tools": ["Claude", "Projects", "custom prompts per team"]}, {"t": "Trainings at NotuBiz", "before": "Municipal councils and clerks who had to adopt new software, many with little digital confidence.", "after": "Five regional sessions a year, a conference, product testing with users. Every training finished on time with satisfied participants.", "tools": ["workshops", "regiobijeenkomsten", "Copilot as a user"]}, {"t": "CRM in Brevo and Lyfter", "before": "Contacts synced as blocklisted, emails showed blank names, nobody saw what a member was worth.", "after": "A three layer customer journey, one customer ID and LTV at 3, 6, 9 and 12 months, handed over with documentation.", "tools": ["Claude Projects", "Brevo", "Lyfter"]}, {"t": "Agents and the waste radar", "before": "Weekly manual ad analysis; overproduction visible only once it was waste.", "after": "Ad fatigue agents for Meta and Google Ads; a radar that flags at-risk products ahead of rescue campaigns. Improvement sessions scheduled before handover.", "tools": ["Claude Code", "Meta & Google Ads"]}]}, "fit": {"h": "Fit with the role", "sub": "Your requirements, with what I put against them. Including where I'm still growing.", "ok": "Strong", "mid": "Partial", "dev": "Developing", "rows": [["Experience in AI adoption, L&D, enablement or coaching", "Ran the adoption programme at No Waste Army; trained councils and clerks at NotuBiz; coached webshop owners to independence.", "ok"], ["Facilitating workshops and coaching teams in new ways of working", "Five regional sessions a year, a conference, 45 minute AI sessions, chaired a house of 46 for three years.", "ok"], ["Hands-on with LLMs, copilots and automation", "Claude Code and ChatGPT daily, Copilot at NotuBiz, agents and automations in production.", "ok"], ["Simplify complex concepts", "Manual writer at IMIX; the bridge between Lyfter's developers and marketing, in both directions.", "ok"], ["Sensitivity for resistance, shift it with empathy and clarity", "NPS above 80 with entrepreneurs who knew better; patience is the skill I'm known for.", "ok"], ["Native-level English, Dutch a plus", "Bilingual degree, international dev team, prefers working in English. Dutch native.", "ok"], ["Confidence across teams with different maturity levels", "Done across marketing, box team, support and directors at one organisation.", "ok"], ["Scale: 500+ colleagues and newly acquired companies", "Done at 25 people. The method scales; the headcount is new. First thing I'd build is the playbook.", "mid"], ["Coaching leaders in communication and steering", "Advised directors and entrepreneurs; formal leadership coaching is new.", "dev"]]}, "sw": {"strong": "What I'm good at", "grow": "What I'm working on", "strongItems": [["Knowledge transfer that sticks", "Clients independent after four months, a box team that works with Claude on its own."], ["Finding the use case in someone's own week", "Not features. Their inbox, their report, their meeting notes. One habit per session."], ["Translating in both directions", "Marketing wishes into tickets for developers, developer planning back into something marketing accepts."], ["Patience under pressure", "NPS above 80 with headstrong entrepreneurs. Council trainings always on time, with happy participants."]], "growItems": [["Too modest about my own value", "This page is my practice."], ["I take over when I get excited", "Agree upfront who holds the mouse, check halfway whether they'd rather continue alone."], ["Scale and leadership coaching", "I've run adoption for 25 people, not 500. The playbook and a champions network are how I'd close that gap in the first quarter."]]}, "tl": {"h": "Career", "sub": "To scale, 2014 to now.", "work": "Work", "edu": "Education", "side": "Alongside studies", "rows": [{"name": "No Waste Army", "yrs": "2026 – now", "note": "Growth & data marketer · data, CRM and AI adoption", "from": 2026.0, "to": 2026.8, "kind": "work", "now": true}, {"name": "NotuBiz", "yrs": "2024 – 2026", "note": "Marketing communication advisor · regional sessions and training", "from": 2024.0, "to": 2026.0, "kind": "work"}, {"name": "Ecommence", "yrs": "2023 – 2024", "note": "Owner · webshops until they could do it alone, plus Landover", "from": 2023.0, "to": 2024.0, "kind": "work"}, {"name": "Bol", "yrs": "2021 – 2023", "note": "Partner account specialist · NPS above 80", "from": 2021.0, "to": 2023.0, "kind": "work"}, {"name": "Student house chair", "yrs": "2018 – 2021", "note": "Largest house in Enschede, 46 residents", "from": 2018.7, "to": 2021.5, "kind": "side"}, {"name": "MSc Marketing Communication", "yrs": "2018 – 2020", "note": "University of Twente · change management", "from": 2018.7, "to": 2020.7, "kind": "edu"}, {"name": "BSc International Business Administration", "yrs": "2014 – 2018", "note": "University of Twente", "from": 2014.7, "to": 2018.5, "kind": "edu"}]}, "ask": {"h": "Questions you might ask", "sub": "Click a question.", "hint": "click for the answer", "sub2": "Answer", "items": [["Who makes AI adoption more than a link to ChatGPT?", "Tom Huiskes"], ["Who gets a box team to run on Claude without him in the room?", "Tom Huiskes"], ["Who made himself redundant at his clients within four months?", "Tom Huiskes", "and calls that a feature"], ["Who trained municipal clerks with little digital experience and kept every session on time?", "Tom Huiskes"], ["Who keeps an NPS above 80 with entrepreneurs who know better?", "Tom Huiskes"], ["What can't Tom do yet?", "Adoption at 500-person scale and formal leadership coaching. Both start with a playbook and a champions network, which is what I'd build in quarter one.", "real answer"], ["What does Tom want from Haystack?", "Scale, English, and a leadership that has already decided AI-first. The hard part is making it stick in each team, and that's my part.", "real answer"], ["When can Tom start?", "From November. First I'm finishing the handover at No Waste Army so the team can carry on.", "real answer"], ["Who should you hire?", "Tom Huiskes", "you saw it coming"]]}, "pers": {"h": "Off the clock", "text": ["I read a lot, play football and tennis, and go to all kinds of workshops with my girlfriend and friends. I lived in Portugal for a while, want to travel more than just on holiday, and honestly prefer speaking English to Dutch.", "I follow AI off the clock too: from models that recognise forms of cancer to image creation, where the potential and the risks are biggest right now."]}, "contact": {"email": "tom.huiskes@hotmail.com", "phone": "+31 6 11 19 77 55", "linkedin": "https://www.linkedin.com/in/tom-huiskes-8201b2b3/", "copy": "copy", "copied": "copied"}, "foot": {"note": "Built by me in Claude Code, as an example of what I mean by 'getting it working'."}};

document.documentElement.lang = T.lang;
const get = p => p.split(".").reduce((o,k)=>o && o[k], T);
const el = (tag, cls, txt) => { const e=document.createElement(tag); if(cls) e.className=cls; if(txt!==undefined) e.textContent=txt; return e; };
document.querySelectorAll("[data-t]").forEach(e=>{ const v=get(e.dataset.t); if(v!==undefined) e.textContent=v; });

const nav=document.getElementById("nav");
T.nav.forEach(([id,label])=>{ const a=el("a",null,label); a.href="#"+id; nav.appendChild(a); });

const facts=document.getElementById("facts");
T.facts.forEach(([k,v])=>{ const d=el("div"); d.append(el("div","k",k), el("div","v",v)); facts.appendChild(d); });

const story=document.getElementById("story");
T.why.steps.forEach(([n,h,p])=>{ const a=el("article"); a.append(el("div","n",n), el("h3",null,h), el("p",null,p)); story.appendChild(a); });

function beforeAfter(b,a){
  const d=el("div","ba");
  d.append(el("span","t b",T.built.before), el("p",null,b), el("span","t a",T.built.after), el("p",null,a));
  return d;
}
const F=T.built.feature, fe=document.getElementById("feature");
const shot=el("figure","shot"); shot.style.margin="0";
const im=el("img"); im.src=THUMB; im.alt=F.alt; shot.append(im);
const body=el("div","body");
const ftop=el("div","top"); ftop.style.cssText="display:flex;justify-content:space-between;gap:10px;align-items:flex-start";
ftop.append(el("h3",null,F.t), el("span","tag",T.built.live));
const nums=el("div","nums"); F.nums.forEach(([b,l])=>{ const d=el("div"); d.append(el("b",null,b), el("span",null,l)); nums.appendChild(d); });
body.append(ftop, beforeAfter(F.before,F.after), nums, el("p","note",F.note));
fe.append(shot, body);

const P=document.getElementById("projects");
T.built.items.forEach(it=>{
  const c=el("article","proj"); const t=el("div","top"); t.append(el("h3",null,it.t), el("span","tag",T.built.live));
  const tl=el("div","tools"); it.tools.forEach(x=>tl.appendChild(el("span",null,x)));
  c.append(t, beforeAfter(it.before,it.after), tl); P.appendChild(c);
});

const counts={ok:0,mid:0,dev:0}; T.fit.rows.forEach(r=>counts[r[2]]++);
const meter=document.getElementById("meter");
["ok","mid","dev"].forEach(k=>{ if(!counts[k]) return; const i=el("i",k); i.style.flex=counts[k]; meter.appendChild(i); });
meter.setAttribute("role","img"); meter.setAttribute("aria-label",`${counts.ok} ${T.fit.ok}, ${counts.mid} ${T.fit.mid}, ${counts.dev} ${T.fit.dev}`);
const lg=document.getElementById("legend");
[["ok","var(--ok)"],["mid","var(--mid)"],["dev","var(--dev)"]].forEach(([k,c])=>{ const s=el("span"); const i=el("i"); i.style.background=c; s.append(i, el("b",null,String(counts[k])), document.createTextNode(" "+T.fit[k].toLowerCase())); lg.appendChild(s); });
const FT=document.getElementById("fit-table");
T.fit.rows.forEach(r=>{ const row=el("div","row"); const d=el("span","dot "+r[2]); d.title=T.fit[r[2]]; row.append(d, el("div","req",r[0]), el("div","ev",r[1])); FT.appendChild(row); });

const S=document.getElementById("strong"); T.sw.strongItems.forEach(([b,p])=>{ const d=el("div","it"); d.append(el("b",null,b), el("p",null,p)); S.appendChild(d); });
const G=document.getElementById("grow"); T.sw.growItems.forEach(([b,p])=>{ const d=el("div","it"); d.append(el("b",null,b), el("p",null,p)); G.appendChild(d); });

/* timeline, to scale: 2014.0 – 2027.0 */
const Y0=2014, Y1=2027, pct=y=>((y-Y0)/(Y1-Y0)*100);
const TL=document.getElementById("tl");
const axis=el("div","axis"); for(let y=2014;y<=2026;y+=2){ const s=el("span",null,String(y)); s.style.left=pct(y)+"%"; axis.appendChild(s); }
TL.appendChild(el("div")); TL.appendChild(axis);
T.tl.rows.forEach(r=>{
  const lab=el("div","lab"); const yr=el("span","yrs",r.yrs); const b=el("b",null,r.name);
  lab.append(yr,b,el("small",null,r.note));
  const tr=el("div","track"); const seg=el("div","seg "+r.kind+(r.now?" now":""));
  seg.style.left=pct(r.from)+"%"; seg.style.width=(pct(r.to)-pct(r.from))+"%"; seg.title=r.name+" · "+r.yrs;
  tr.appendChild(seg); TL.append(lab,tr);
});
const key=document.getElementById("tlkey");
[["var(--accent)",T.tl.work],["var(--edu)",T.tl.edu],["var(--side)",T.tl.side]].forEach(([c,t])=>{ const s=el("span"); const i=el("i"); i.style.background=c; s.append(i,document.createTextNode(t)); key.appendChild(s); });

const A=document.getElementById("ask-grid");
T.ask.items.forEach((it,i)=>{ const real=it[1]!=="Tom Huiskes"; const d=el("div","q"+(real?" spark":""));
  const b=el("button"); b.type="button"; b.id="q"+i; b.setAttribute("aria-expanded","false");
  const fr=el("div","face front"); fr.append(el("div","qtext",it[0]), el("div","hint",T.ask.hint));
  const bk=el("div","face back"); bk.append(el("div","ans"+(real?" real":""),it[1]), el("div","sub",it[2]||T.ask.sub2));
  b.append(fr,bk); b.addEventListener("click",()=>{ const f=d.classList.toggle("flipped"); b.setAttribute("aria-expanded",String(f)); });
  d.appendChild(b); A.appendChild(d); });

const PE=document.getElementById("personal"); T.pers.text.forEach(t=>PE.appendChild(el("p",null,t)));

const C=document.getElementById("contact");
const mail=el("span",null,T.contact.email);
const cb=el("button",null,T.contact.copy); cb.type="button"; cb.id="copy-mail";
cb.addEventListener("click",()=>{ const done=()=>{cb.textContent=T.contact.copied; setTimeout(()=>cb.textContent=T.contact.copy,1500);};
  const sel=()=>{ const r=document.createRange(); r.selectNodeContents(mail.firstChild); const s=getSelection(); s.removeAllRanges(); s.addRange(r); };
  try{ navigator.clipboard.writeText(T.contact.email).then(done).catch(sel); }catch(e){ sel(); } });
mail.appendChild(cb); C.appendChild(mail);
C.appendChild(el("span",null,T.contact.phone));
const li=el("a",null,"LinkedIn"); li.href=T.contact.linkedin; li.target="_blank"; li.rel="noopener"; C.appendChild(li);
</script>
